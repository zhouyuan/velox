# Nightly expression fuzzer of the Presto functions with Flink as the reference
# DB: builds velox_expression_fuzzer_test, starts a local Flink 1.19 cluster
# with the SQL Gateway, and fuzzes for an hour with --flink_gateway_url.
# Failures are reported as GitHub issues labeled 'flink-fuzzer'; a failure
# whose reason matches an open issue is added to it as a comment.
#
# GitHub runs scheduled workflows from the default branch only, so this file
# must be on the default branch (main) for the nightly run. The code under test
# is checked out from FUZZ_REF: main, or the 'ref' input of a manual run.

name: Flink Fuzzer

on:
  schedule:
    # 02:00 UTC every night.
    - cron: 0 2 * * *

  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to fuzz
        default: main
        required: true
      duration_sec:
        description: Fuzzer duration in seconds
        default: "3600"
        required: true
      seed:
        description: Fuzzer seed (empty for a random seed)
        default: ""
        required: false
      num_threads:
        description: Number of threads to use for the build
        default: "4"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

env:
  FUZZ_REF: ${{ inputs.ref || 'main' }}
  DURATION_SEC: ${{ inputs.duration_sec || '3600' }}
  NUM_THREADS: ${{ inputs.num_threads || '4' }}
  FLINK_VERSION: 1.19.2
  FLINK_GATEWAY_URL: http://localhost:8083

jobs:
  flink-fuzzer:
    name: Presto Functions Fuzzer with Flink SOT
    # Only run on the fork that hosts this job.
    if: ${{ github.repository == 'zhouyuan/velox' }}
    runs-on: ubuntu-latest
    container: ghcr.io/facebookincubator/velox-dev:centos9-debug
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: "${{ github.workspace }}/ccache"
      BUILD_DIR: "${{ github.workspace }}/_build/debug"
      REPRO_DIR: /tmp/flink_fuzzer_repro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FUZZ_REF }}
          persist-credentials: false

      - name: Fix git permissions
        # Usually actions/checkout does this but as we run in a container
        # it doesn't work.
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Record revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure ccache directory exists
        run: mkdir -p "${CCACHE_DIR}"

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-flink-fuzzer-centos-v1-${{ steps.revision.outputs.sha }}
          restore-keys: |
            ccache-flink-fuzzer-centos-v1-

      - name: Zero Ccache Statistics
        run: ccache -sz

      - name: Configure Build
        id: configure
        env:
          EXTRA_CMAKE_FLAGS: >
            -DVELOX_MONO_LIBRARY=ON
            -DVELOX_BUILD_SHARED=ON
        run: make cmake BUILD_DIR=debug BUILD_TYPE=Debug

      - name: Build Fuzzer
        id: build
        run: |
          cmake --build "${BUILD_DIR}" -j "${NUM_THREADS}" --target \
            velox_expression_fuzzer_test \
            flink_sql_test \
            flink_query_runner_test

      - name: Ccache after build
        if: ${{ !cancelled() }}
        run: ccache -s

      - name: Save ccache
        # Save even if the build fails or times out, so that the next run
        # resumes from the objects built so far.
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-flink-fuzzer-centos-v1-${{ steps.revision.outputs.sha }}

      - name: Run Flink SQL Translation Tests
        id: sql_test
        run: |
          "${BUILD_DIR}"/velox/exec/fuzzer/tests/flink_sql_test
          "${BUILD_DIR}"/velox/exec/fuzzer/tests/flink_query_runner_test

      - name: Install Java
        run: dnf install -y java-17-openjdk-headless

      - name: Restore Flink distribution
        id: flink_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/flink-${{ env.FLINK_VERSION }}
          key: flink-dist-${{ env.FLINK_VERSION }}-scala_2.12

      - name: Download Flink
        if: ${{ steps.flink_cache.outputs.cache-hit != 'true' }}
        run: |
          curl -sSfL --retry 3 \
            "https://archive.apache.org/dist/flink/flink-${FLINK_VERSION}/flink-${FLINK_VERSION}-bin-scala_2.12.tgz" \
            | tar -xz -C /opt

      - name: Save Flink distribution
        if: ${{ steps.flink_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/flink-${{ env.FLINK_VERSION }}
          key: flink-dist-${{ env.FLINK_VERSION }}-scala_2.12

      - name: Start Flink
        id: flink
        run: |
          export FLINK_HOME=/opt/flink-${FLINK_VERSION}
          echo "FLINK_HOME=${FLINK_HOME}" >> "$GITHUB_ENV"
          bash scripts/ci/flink/start-flink.sh

      - name: Run Flink Query Runner Tests
        id: runner_test
        run: |
          FLINK_GATEWAY_URL="${FLINK_GATEWAY_URL}" \
            "${BUILD_DIR}"/velox/exec/fuzzer/tests/flink_query_runner_test \
            --gtest_also_run_disabled_tests

      - name: Run Expression Fuzzer with Flink SOT
        id: fuzzer
        # The fuzzer runs for DURATION_SEC; leave room for slow iterations.
        timeout-minutes: 90
        env:
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          set -o pipefail
          mkdir -p "${REPRO_DIR}/logs"
          chmod -R 777 "${REPRO_DIR}"
          seed="${INPUT_SEED}"
          if [[ -n "${seed}" && ! "${seed}" =~ ^[0-9]+$ ]]; then
            echo "Seed must be a non-negative integer: ${seed}" >&2
            exit 1
          fi
          if [[ -z "${seed}" ]]; then
            seed=$(( (RANDOM << 15) | RANDOM ))
          fi
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          echo "Seed: ${seed}"
          "${BUILD_DIR}"/velox/expression/fuzzer/velox_expression_fuzzer_test \
              --seed "${seed}" \
              --duration_sec "${DURATION_SEC}" \
              --flink_gateway_url "${FLINK_GATEWAY_URL}" \
              --enable_variadic_signatures \
              --velox_fuzzer_enable_complex_types=false \
              --velox_fuzzer_enable_decimal_type \
              --minloglevel=0 \
              --stderrthreshold=2 \
              --log_dir="${REPRO_DIR}/logs" \
              --repro_persist_path="${REPRO_DIR}" \
              2>&1 | tee "${REPRO_DIR}/fuzzer-output.log"
          echo -e "\n\nFlink fuzzer run finished successfully."

      - name: Collect logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "${REPRO_DIR}"
          # The INFO log of a one-hour run is large. Keep its tail, which holds
          # the failing iteration, and drop the rest.
          for log in "${REPRO_DIR}"/logs/*.INFO.*; do
            [[ -f "${log}" ]] || continue
            tail -n 20000 "${log}" > "${log}.tail" && rm -f "${log}"
          done
          if [[ -n "${FLINK_HOME:-}" && -d "${FLINK_HOME}/log" ]]; then
            mkdir -p "${REPRO_DIR}/flink-logs"
            cp "${FLINK_HOME}"/log/*.log "${REPRO_DIR}/flink-logs/" || true
          fi

      - name: Upload artifacts
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flink-fuzzer-artifacts
          path: ${{ env.REPRO_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Write failure report
        id: report
        if: ${{ failure() }}
        env:
          SEED: ${{ steps.fuzzer.outputs.seed }}
          SHA: ${{ steps.revision.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          OUTCOME_CONFIGURE: ${{ steps.configure.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_SQL_TEST: ${{ steps.sql_test.outcome }}
          OUTCOME_FLINK: ${{ steps.flink.outcome }}
          OUTCOME_RUNNER_TEST: ${{ steps.runner_test.outcome }}
          OUTCOME_FUZZER: ${{ steps.fuzzer.outcome }}
        run: bash scripts/ci/flink/fuzzer-report.sh "${RUNNER_TEMP}/flink-fuzzer-report"

      - name: Report issue
        if: ${{ failure() && steps.report.outcome == 'success' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REPORT_DIR: ${{ runner.temp }}/flink-fuzzer-report
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = process.env.REPORT_DIR;
            const title = fs.readFileSync(path.join(dir, 'title.txt'), 'utf8').trim();
            const body = fs.readFileSync(path.join(dir, 'body.md'), 'utf8');
            const label = 'flink-fuzzer';

            try {
              await github.rest.issues.getLabel({...context.repo, name: label});
            } catch (e) {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'd93f0b',
                description: 'Failures found by the nightly Flink fuzzer'});
            }

            // Add to the open issue with the same failure reason, if any.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: label, per_page: 100});
            const existing = open.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body});
              core.notice(`Commented on issue #${existing.number}: ${title}`);
            } else {
              const {data: issue} = await github.rest.issues.create({
                ...context.repo, title, body, labels: [label]});
              core.notice(`Opened issue #${issue.number}: ${title}`);
            }
